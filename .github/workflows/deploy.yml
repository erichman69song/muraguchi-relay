name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"

jobs:
  deploy:
    name: Deploy relay to EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          docker build -t erichman69song/muraguchi-relay:latest .
          docker push erichman69song/muraguchi-relay:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          script: |
            docker pull erichman69song/muraguchi-relay:latest
            docker stop muraguchi-relay || true
            docker rm muraguchi-relay || true
            docker run -d \
              --name muraguchi-relay \
              --restart unless-stopped \
              --env-file /home/ubuntu/relay/.env \
              -p 8080:8080 \
              erichman69song/muraguchi-relay:latest
            docker image prune -f
