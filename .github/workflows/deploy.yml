name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  deploy:
    name: Deploy relay to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s
          script: |
            set -e
            cd /opt/muraguchi-relay

            # Pull latest code
            git fetch origin
            git reset --hard origin/main
            echo "Code updated to $(git rev-parse --short HEAD)"

            # Ensure systemd service exists (idempotent)
            SERVICE_FILE="/etc/systemd/system/muraguchi-relay.service"
            if [ ! -f "$SERVICE_FILE" ]; then
              echo "Creating systemd service file..."
              cat << 'SVCEOF' | sudo tee "$SERVICE_FILE" > /dev/null
[Unit]
Description=Muraguchi Relay Service
After=network.target

[Service]
Type=simple
User=ubuntu
WorkingDirectory=/opt/muraguchi-relay
ExecStart=/opt/muraguchi-relay/.venv/bin/python -m uvicorn relay_server:app --host 0.0.0.0 --port 8080
Restart=always
RestartSec=3
StandardOutput=append:/opt/muraguchi-relay/relay.log
StandardError=append:/opt/muraguchi-relay/relay.log

[Install]
WantedBy=multi-user.target
SVCEOF
              sudo systemctl daemon-reload
              sudo systemctl enable muraguchi-relay
            fi

            # Graceful restart via systemd
            echo "Restarting relay via systemd..."
            sudo systemctl restart muraguchi-relay

            # Wait and verify
            sleep 4
            curl -sf http://localhost:8080/v1/relay/health && echo "Relay is healthy!" || {
              echo "Health check FAILED:"
              tail -15 /opt/muraguchi-relay/relay.log
              exit 1
            }
