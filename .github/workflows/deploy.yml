name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  deploy:
    name: Deploy relay to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
            cd /home/ubuntu/relay
            git fetch origin
            git reset --hard origin/main
            echo "Code updated to $(git rev-parse --short HEAD)"

            # Restart relay service
            if systemctl --user is-active muraguchi-relay 2>/dev/null; then
              echo "Restarting via systemd..."
              systemctl --user restart muraguchi-relay
            else
              echo "Restarting via pkill + python..."
              pkill -f "uvicorn relay_server:app" || true
              sleep 1
              nohup python -m uvicorn relay_server:app --host 0.0.0.0 --port 8080 >> /home/ubuntu/relay/relay.log 2>&1 &
              sleep 3
              if curl -sf http://localhost:8080/v1/relay/health > /dev/null; then
                echo "Relay is healthy!"
              else
                echo "WARNING: Relay may not have started correctly"
                tail -10 /home/ubuntu/relay/relay.log
              fi
            fi
